<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Manager - Silent Dark Blues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #2d2d2d;
            --accent: #dc3545;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-bottom: 2px solid var(--accent);
        }

        .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), #ff6b7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container-main {
            padding: 40px 20px;
        }

        .card {
            background: var(--secondary);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(90deg, rgba(220, 53, 69, 0.1), rgba(220, 53, 69, 0.05));
            border-bottom: 2px solid var(--accent);
        }

        .card-title {
            color: var(--accent);
            font-weight: 700;
            margin: 0;
        }

        .table {
            color: #e0e0e0;
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .table tbody tr {
            border-bottom: 1px solid rgba(220, 53, 69, 0.2);
        }

        .table tbody tr:hover {
            background: rgba(220, 53, 69, 0.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #ff6b7a);
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ff6b7a, var(--accent));
            color: white;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #e0e0e0;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            color: #e0e0e0;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.2);
        }

        .form-label {
            color: #b0b0b0;
            font-weight: 600;
        }

        .badge {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge-high {
            background: linear-gradient(135deg, var(--accent), #ff6b7a);
        }

        .badge-normal {
            background: rgba(100, 100, 100, 0.6);
        }

        .status-queued {
            background: rgba(100, 150, 255, 0.2);
            color: #64b5ff;
        }

        .status-ready {
            background: rgba(100, 200, 100, 0.2);
            color: #64c864;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(220, 53, 69, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent), #ff6b7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-mini {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .stat-mini-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-mini-label {
            color: #999;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-music"></i> Silent Dark Blues</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/schedule">Schedule</a></li>
                    <li class="nav-item"><a class="nav-link" href="/health">Health</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-main">
        <h1 class="header-title"><i class="fas fa-calendar"></i> Upload Schedule Manager</h1>
        <p style="color: #999; margin-bottom: 30px;">Queue and manage video uploads</p>

        <!-- Quick Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-mini">
                    <div class="stat-mini-label">Queued</div>
                    <div class="stat-mini-value" id="stat-q">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-mini">
                    <div class="stat-mini-label">Ready</div>
                    <div class="stat-mini-value" id="stat-r">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-mini">
                    <div class="stat-mini-label">Uploaded</div>
                    <div class="stat-mini-value" id="stat-u">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-mini">
                    <div class="stat-mini-label">Total</div>
                    <div class="stat-mini-value" id="stat-t">-</div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Queue Form -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title"><i class="fas fa-plus"></i> Batch Queue</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Number of Videos</label>
                            <input type="number" class="form-control" id="batchNum" value="5" min="1" max="50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Start Date (days ahead)</label>
                            <input type="number" class="form-control" id="batchStart" value="1" min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Frequency (days between)</label>
                            <input type="number" class="form-control" id="batchFreq" value="3" min="1">
                        </div>
                        <button class="btn btn-primary w-100" onclick="doBatchQueue()">
                            <i class="fas fa-plus-circle"></i> Queue Videos
                        </button>
                    </div>
                </div>
            </div>

            <!-- Single Queue Form -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title"><i class="fas fa-film"></i> Queue Single</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Episode Number</label>
                            <input type="number" class="form-control" id="singleEp" value="1" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload in (hours)</label>
                            <input type="number" class="form-control" id="singleHours" value="24" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="singlePriority">
                                <option value="normal">Normal</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100" onclick="doSingleQueue()">
                            <i class="fas fa-plus-circle"></i> Queue Episode
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Queue Display -->
        <div class="card">
            <div class="card-header">
                <h5 class="card-title"><i class="fas fa-list"></i> Upload Queue</h5>
            </div>
            <div class="card-body">
                <div id="queueTable">
                    <div class="text-center">
                        <div class="loading"></div>
                        <p class="mt-3">Loading queue...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateSchedule();
            setInterval(updateSchedule, 15000);
        });

        async function updateSchedule() {
            try {
                const response = await fetch('/api/schedule/status');
                const data = await response.json();
                const status = data.data;

                document.getElementById('stat-q').textContent = status.queued;
                document.getElementById('stat-r').textContent = status.ready_for_upload;
                document.getElementById('stat-u').textContent = status.uploaded;
                document.getElementById('stat-t').textContent = status.total_scheduled;

                // Load queue
                const queueResp = await fetch('/api/schedule/queue');
                const queueData = await queueResp.json();

                if (queueData.videos.length === 0) {
                    document.getElementById('queueTable').innerHTML = '<p class="text-center text-muted">No videos in queue</p>';
                    return;
                }

                let html = '<div class="table-responsive"><table class="table"><thead><tr>' +
                    '<th>Episode</th>' +
                    '<th>Scheduled Upload</th>' +
                    '<th>Priority</th>' +
                    '<th>Status</th>' +
                    '</tr></thead><tbody>';

                for (const video of queueData.videos) {
                    const date = new Date(video.scheduled_upload).toLocaleString();
                    const badgeClass = video.priority === 'high' ? 'badge-high' : 'badge-normal';
                    const statusBadgeClass = video.status === 'queued' ? 'status-queued' : 'status-ready';

                    html += `<tr>
                        <td><strong>EP ${video.episode}</strong></td>
                        <td>${date}</td>
                        <td><span class="badge ${badgeClass}">${video.priority.toUpperCase()}</span></td>
                        <td><span class="badge ${statusBadgeClass}">${video.status.toUpperCase()}</span></td>
                    </tr>`;
                }

                html += '</tbody></table></div>';
                document.getElementById('queueTable').innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function doBatchQueue() {
            const num = parseInt(document.getElementById('batchNum').value);
            const start = parseInt(document.getElementById('batchStart').value);
            const freq = parseInt(document.getElementById('batchFreq').value);

            try {
                const response = await fetch('/api/schedule/batch-queue', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        num_videos: num,
                        start_days_ahead: start,
                        frequency_days: freq
                    })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    alert(`✓ Queued ${data.jobs} episodes`);
                    updateSchedule();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error: ' + error);
            }
        }

        async function doSingleQueue() {
            const ep = parseInt(document.getElementById('singleEp').value);
            const hours = parseInt(document.getElementById('singleHours').value);
            const priority = document.getElementById('singlePriority').value;

            try {
                const response = await fetch('/api/schedule/queue-single', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        episode_number: ep,
                        hours_ahead: hours,
                        priority: priority
                    })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    alert(`✓ Queued episode ${ep}`);
                    updateSchedule();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error: ' + error);
            }
        }
    </script>
</body>
</html>
